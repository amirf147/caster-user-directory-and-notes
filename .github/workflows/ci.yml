name: Caster User Content CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Validate Rules & Formatting
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint Python Code (Ruff)
        run: ruff check caster_user_content scripts

      - name: Verify Formatting (Ruff Format)
        run: ruff format --check caster_user_content scripts

      - name: Run Absolute Path Checker
        run: python scripts/check_absolute_paths.py

      - name: Run Voice Command Uniqueness Checker
        run: python scripts/check_command_uniqueness.py
