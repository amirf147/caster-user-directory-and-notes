name: Caster Rules CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint Python Code
      run: ruff check .

    - name: Run Absolute Path Checker
      run: python scripts/check_absolute_paths.py

    - name: Run Voice Command Uniqueness Checker
      run: python scripts/check_command_uniqueness.py
